<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متن راست‌چین</title>
  <style>
    @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Regular.woff2') format('woff2'); font-weight: normal; }
    @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Bold.woff2') format('woff2'); font-weight: bold; }
    @font-face { font-family: 'Shabnam'; src: url('fonts/Shabnam.woff2') format('woff2'); font-weight: normal; }
    @font-face { font-family: 'Shabnam'; src: url('fonts/Shabnam-Bold.woff2') format('woff2'); font-weight: bold; }
    @font-face { font-family: 'Sahel'; src: url('fonts/Sahel.woff2') format('woff2'); font-weight: normal; }
    @font-face { font-family: 'Sahel'; src: url('fonts/Sahel-Bold.woff2') format('woff2'); font-weight: bold; }
    @font-face { font-family: 'Samim'; src: url('fonts/Samim.woff2') format('woff2'); font-weight: normal; }
    @font-face { font-family: 'Samim'; src: url('fonts/Samim-Bold.woff2') format('woff2'); font-weight: bold; }

    * { box-sizing: border-box; }

    /* ---------- تم‌ها: پیش‌فرض روشن، پیرو سیستم، یا انتخاب دستی ---------- */
    :root {
      --bg: #eef0f5;
      --toolbar-bg: #fff;
      --toolbar-border: #e2e4ea;
      --toolbar-shadow: rgba(0,0,0,0.04);
      --text: #333;
      --sub-text: #555;
      --border: #ddd;
      --input-bg: #fafafa;
      --btn-bg: #fafafa;
      --btn-hover-bg: #eee;
      --page-bg: #fff;
      --page-shadow: rgba(0,0,0,0.07);
      --content-text: #1c1c1e;
      --placeholder-text: #b5b5bd;
      --code-bg: #f4f4f7;
      --code-border: #dcdce3;
      --code-text: #1c1c1e;
      --blockquote-border: #c8c9d6;
      --blockquote-text: #666;
      --link-color: #3b59b6;
      --toast-bg: #333;
      --toast-text: #fff;
      --accent: #3b59b6;
      --accent-hover: #324c9e;
      --tok-keyword: #1a56db;
      --tok-string: #1a7f37;
      --tok-comment: #8b8fa3;
      --tok-var: #b5314c;
      --tok-func: #b35a00;
      --tok-num: #8250df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --toolbar-bg: #1f2128;
        --toolbar-border: #33353e;
        --toolbar-shadow: rgba(0,0,0,0.3);
        --text: #d8d9e0;
        --sub-text: #a7a9b6;
        --border: #3a3c46;
        --input-bg: #262832;
        --btn-bg: #262832;
        --btn-hover-bg: #30323d;
        --page-bg: #1f2128;
        --page-shadow: rgba(0,0,0,0.45);
        --content-text: #e7e7ee;
        --placeholder-text: #6d6f7c;
        --code-bg: #14151a;
        --code-border: #34363f;
        --code-text: #e2e3ea;
        --blockquote-border: #454754;
        --blockquote-text: #9d9fac;
        --link-color: #7f9dff;
        --toast-bg: #eaeaf0;
        --toast-text: #222;
        --accent: #5470d6;
        --accent-hover: #6b84e0;
        --tok-keyword: #7aa2f7;
        --tok-string: #7ec699;
        --tok-comment: #6d6f7c;
        --tok-var: #e07a9e;
        --tok-func: #e0a458;
        --tok-num: #c792ea;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181d;
      --toolbar-bg: #1f2128;
      --toolbar-border: #33353e;
      --toolbar-shadow: rgba(0,0,0,0.3);
      --text: #d8d9e0;
      --sub-text: #a7a9b6;
      --border: #3a3c46;
      --input-bg: #262832;
      --btn-bg: #262832;
      --btn-hover-bg: #30323d;
      --page-bg: #1f2128;
      --page-shadow: rgba(0,0,0,0.45);
      --content-text: #e7e7ee;
      --placeholder-text: #6d6f7c;
      --code-bg: #14151a;
      --code-border: #34363f;
      --code-text: #e2e3ea;
      --blockquote-border: #454754;
      --blockquote-text: #9d9fac;
      --link-color: #7f9dff;
      --toast-bg: #eaeaf0;
      --toast-text: #222;
      --accent: #5470d6;
      --accent-hover: #6b84e0;
      --tok-keyword: #7aa2f7;
      --tok-string: #7ec699;
      --tok-comment: #6d6f7c;
      --tok-var: #e07a9e;
      --tok-func: #e0a458;
      --tok-num: #c792ea;
    }
    :root[data-theme="light"] {
      --bg: #eef0f5;
      --toolbar-bg: #fff;
      --toolbar-border: #e2e4ea;
      --toolbar-shadow: rgba(0,0,0,0.04);
      --text: #333;
      --sub-text: #555;
      --border: #ddd;
      --input-bg: #fafafa;
      --btn-bg: #fafafa;
      --btn-hover-bg: #eee;
      --page-bg: #fff;
      --page-shadow: rgba(0,0,0,0.07);
      --content-text: #1c1c1e;
      --placeholder-text: #b5b5bd;
      --code-bg: #f4f4f7;
      --code-border: #dcdce3;
      --code-text: #1c1c1e;
      --blockquote-border: #c8c9d6;
      --blockquote-text: #666;
      --link-color: #3b59b6;
      --toast-bg: #333;
      --toast-text: #fff;
      --accent: #3b59b6;
      --accent-hover: #324c9e;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    /* هدر چسبان بالای صفحه: هر دو نوار ابزار + نوار فایل‌ها با هم اسکرول رو نادیده می‌گیرن */
    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar {
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px var(--toolbar-shadow);
    }
    .toolbar .brand {
      font-weight: bold;
      font-size: 14px;
      color: var(--accent);
      margin-left: auto;
    }
    .control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--sub-text);
    }
    .control.file-current { display: none; }
    .control.file-current.visible { display: flex; }
    .current-file-name {
      color: var(--accent);
      font-weight: bold;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      unicode-bidi: plaintext;
    }
    select, input[type="range"] {
      font-family: inherit;
      font-size: 12.5px;
    }
    select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
    }
    input[type="range"] { width: 110px; cursor: pointer; accent-color: var(--accent); }
    input[type="url"] {
      direction: ltr;
      text-align: left;
      width: 240px;
      max-width: 45vw;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--input-bg);
      color: var(--text);
    }
    input[type="url"]:focus { outline: 2px solid var(--accent); }
    .size-val { min-width: 34px; text-align: center; color: var(--accent); font-weight: bold; }
    button {
      font-family: inherit;
      font-size: 12.5px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--btn-hover-bg); }
    button.accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.accent:hover { background: var(--accent-hover); }
    button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* نوار افقی لیست فایل‌های .md یک پوشه‌ی انتخاب‌شده؛ به سبک سکشن‌های نوار ابزار بالا (برچسب + محتوا) */
    .file-header {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 10px 20px;
      box-shadow: 0 1px 4px var(--toolbar-shadow);
    }
    .file-header.visible { display: flex; }
    .file-header-label {
      flex: 0 0 auto;
      font-size: 12.5px;
      color: var(--sub-text);
      white-space: nowrap;
    }
    .file-chip-list {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex: 1 1 auto;
      min-width: 0;
    }

    /* بنری که وقتی رفرش نتونه بی‌صدا دوباره اجازه‌ی دسترسی به فایل/پوشه‌ی لوکال رو بگیره نشون داده میشه */
    .perm-banner {
      display: none;
      align-items: center;
      gap: 12px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 10px 20px;
      font-size: 12.5px;
      color: var(--sub-text);
      box-shadow: 0 1px 4px var(--toolbar-shadow);
    }
    .perm-banner.visible { display: flex; }
    .file-chip {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
      padding: 4px 4px 4px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--btn-bg);
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      font-size: 12.5px;
      transition: background .15s;
    }
    .file-chip:hover { background: var(--btn-hover-bg); }
    .file-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .file-chip .chip-name { pointer-events: none; padding-inline-end: 4px; }
    .file-chip .chip-newtab {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--page-bg);
      color: var(--sub-text);
      cursor: pointer;
      padding: 0;
    }
    .file-chip .chip-newtab svg { width: 13px; height: 13px; pointer-events: none; }
    .file-chip .chip-newtab:hover,
    .file-chip .chip-newtab:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      outline: none;
    }
    .file-chip.active .chip-newtab {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }
    .file-chip.active .chip-newtab:hover,
    .file-chip.active .chip-newtab:focus-visible {
      background: rgba(255,255,255,0.32);
      border-color: #fff;
    }

    /* برگه متن */
    .page {
      max-width: 800px;
      margin: 28px auto 60px;
      background: var(--page-bg);
      border-radius: 14px;
      box-shadow: 0 2px 14px var(--page-shadow);
      padding: 40px 48px;
      min-height: 400px;
    }
    .document-layout {
      width: calc(100% - 32px);
      max-width: 800px;
      margin: 28px auto 60px;
    }
    .document-layout .page { margin: 0; min-width: 0; }
    .document-layout.has-outline {
      max-width: 1100px;
      display: grid;
      grid-template-columns: 220px minmax(0, 800px);
      gap: 24px;
      align-items: start;
    }
    .outline {
      position: sticky;
      top: calc(var(--header-height, 150px) + 16px);
      max-height: calc(100vh - var(--header-height, 150px) - 32px);
      overflow-y: auto;
      background: var(--page-bg);
      border: 1px solid var(--toolbar-border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.8;
    }
    .outline[hidden] { display: none; }
    .outline-title { font-weight: 700; margin-bottom: 10px; }
    .outline a { display: block; padding: 6px 10px; color: var(--sub-text); text-decoration: none; border-radius: 6px; }
    .outline a:hover, .outline a[aria-current] { background: var(--code-bg); color: var(--link-color); }
    #preview :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: calc(var(--header-height, 150px) + 16px); }
    .save-status { font-size: 11px; color: var(--sub-text); }
    button:disabled { opacity: .55; cursor: default; }
    .code-panel { position: relative; margin-bottom: .9em; padding-top: 34px; }
    .code-panel .copy-code-btn { position: absolute; inset-inline-end: 0; top: 0; padding: 3px 10px; font-size: 11px; user-select: none; }
    #preview .code-panel pre { margin-bottom: 0; }
    #preview .task-item { display: flex; gap: .6em; align-items: flex-start; list-style: none; }
    .task-checkbox { flex: 0 0 auto; width: 18px; height: 18px; margin: .65em 0 0; accent-color: var(--accent); cursor: pointer; }
    .task-body { flex: 1; min-width: 0; }
    #preview .task-body > :last-child { margin-bottom: 0; }
    #preview .task-item:has(> input:checked) > .task-body > p:first-child { text-decoration: line-through; color: var(--sub-text); }
    @media (max-width: 900px) {
      .document-layout.has-outline { display: block; max-width: 800px; }
      .outline { position: static; max-height: 240px; margin-bottom: 16px; }
      .document-layout .page { padding: 24px; }
    }
    #content, #preview {
      direction: rtl;
      text-align: right;
      font-size: 18px;
      line-height: 2.1;
      color: var(--content-text);
      word-wrap: break-word;
      outline: none;
      min-height: 320px;
    }
    #content {
      white-space: pre-wrap;
    }
    #preview { display: none; }
    #preview.visible { display: block; }
    #content.hidden { display: none; }
    #content:empty:before {
      content: "متنت رو اینجا بنویس یا paste کن...";
      color: var(--placeholder-text);
    }
    #preview p { margin: 0 0 0.9em; }
    #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
      margin: 1em 0 0.5em;
      line-height: 1.5;
    }
    #preview > :first-child { margin-top: 0; }
    #preview h2 {
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
    }
    #preview strong { font-weight: 700; }
    #preview ul, #preview ol {
      margin: 0 0 0.9em;
      padding-inline-start: 1.6em;
    }
    #preview li { margin-bottom: 0.35em; }
    #preview li > p { margin-bottom: 0.35em; }
    #preview li > :last-child { margin-bottom: 0; }
    #preview li > ul, #preview li > ol { margin-top: 0.35em; }
    #preview li::marker { color: var(--link-color); }
    #preview blockquote {
      margin: 0 0 0.9em;
      padding: 4px 14px;
      border-inline-start: 3px solid var(--blockquote-border);
      color: var(--blockquote-text);
    }
    #preview hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.2em 0;
    }
    #preview a { color: var(--link-color); }
    #preview .document-image {
      display: block;
      max-width: 100%;
      max-height: 720px;
      height: auto;
      margin: 10px auto;
      border-radius: 8px;
      object-fit: contain;
    }
    #preview td .document-image { max-height: 360px; }
    #preview .image-placeholder {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 12px;
      margin: 10px 0;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--sub-text);
      text-decoration: none;
      cursor: default;
    }
    #preview .image-placeholder button { white-space: normal; }
    #preview .image-source-path { max-width: 100%; overflow-wrap: anywhere; font-size: 11px; }
    .resource-notice {
      padding: 10px 18px;
      background: var(--code-bg);
      color: var(--text);
      font-size: 13px;
    }
    .resource-notice[hidden] { display: none; }
    .resource-notice button { margin-inline-start: 10px; }
    #preview pre.source-file {
      direction: ltr;
      text-align: left;
      overflow-x: auto;
      font: 14px/1.8 Consolas, monospace;
      background: var(--code-bg);
      padding: 12px 0;
    }
    #preview pre.source-file > code { background: none; border: none; padding: 0; font-size: inherit; }
    .source-line { display: flex; min-width: max-content; scroll-margin-top: 180px; }
    .source-line > span { white-space: pre; padding-inline-end: 12px; }
    .source-line .line-number {
      width: 5em;
      flex-shrink: 0;
      text-align: right;
      padding: 0 16px;
      color: var(--sub-text);
      user-select: none;
      text-decoration: none;
    }
    .source-line.selected-line, .source-line:target { background: rgba(127, 157, 255, 0.22); }

    /* ---------- جدول‌های مارک‌داون ---------- */
    #preview .table-wrap {
      overflow-x: auto;
      margin: 0 0 0.9em;
    }
    #preview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88em;
    }
    #preview th, #preview td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: right;
      vertical-align: top;
    }
    #preview thead th {
      background: var(--code-bg);
      font-weight: bold;
      white-space: nowrap;
    }
    #preview tbody tr:nth-child(even) {
      background: rgba(127,127,127,0.06);
    }

    /* ---------- نقل‌قول‌های چندخطی (با لیست/پاراگراف تودرتو) ---------- */
    #preview blockquote > *:first-child { margin-top: 0; }
    #preview blockquote > *:last-child { margin-bottom: 0; }

    /* ---------- کد همیشه چپ‌به‌راست، حتی داخل متن راست‌چین ---------- */
    #preview code {
      direction: ltr;
      unicode-bidi: isolate;
      font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, monospace;
      font-size: 0.86em;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 2px 8px;
      color: var(--code-text);
    }
    #preview pre.code-block {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 0 0 0.9em;
      overflow-x: auto;
      font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, monospace;
      font-size: 0.82em;
      line-height: 1.6;
    }
    #preview pre.code-block[data-lang]::before {
      content: attr(data-lang);
      display: block;
      font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, monospace;
      font-size: 0.82em;
      color: var(--sub-text);
      margin-bottom: 8px;
    }
    #preview pre.code-block code {
      background: none;
      border: none;
      padding: 0;
      font-size: 1em;
    }
    /* ---------- رنگ‌بندی ساده‌ی نحوی داخل بلوک‌های کد ---------- */
    #preview pre.code-block .tok-keyword { color: var(--tok-keyword); }
    #preview pre.code-block .tok-string { color: var(--tok-string); }
    #preview pre.code-block .tok-comment { color: var(--tok-comment); font-style: italic; }
    #preview pre.code-block .tok-var { color: var(--tok-var); }
    #preview pre.code-block .tok-func { color: var(--tok-func); }
    #preview pre.code-block .tok-num { color: var(--tok-num); }

    /* ---------- تولبار شناور روی متن انتخاب‌شده ---------- */
    .sel-toolbar {
      position: fixed;
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--toolbar-bg);
      border: 1px solid var(--toolbar-border);
      border-radius: 8px;
      box-shadow: 0 2px 10px var(--toolbar-shadow);
      padding: 4px;
      z-index: 50;
    }
    .sel-toolbar.show { display: flex; }
    .sel-toolbar button {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      font-size: 12.5px;
      white-space: nowrap;
    }

    /* ---------- نمایش چپ‌چین متن انتخاب‌شده در پیش‌نمایش ---------- */
    #preview .ltr-inline {
      unicode-bidi: isolate;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 50%;
      transform: translateX(50%);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 9px 20px;
      border-radius: 24px;
      font-size: 13px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* موقع پرینت فقط متن چاپ بشه، همیشه با تم روشن */
    @media print {
      .toolbar, .file-header, .perm-banner, .toast, .outline, .copy-code-btn { display: none !important; }
      .document-layout, .document-layout.has-outline { display: block; width: 100%; max-width: 100%; margin: 0; }
      .code-panel { padding-top: 0; }
      body { background: #fff !important; color: #1c1c1e !important; }
      .page { box-shadow: none; margin: 0; max-width: 100%; border-radius: 0; background: #fff !important; }
      #content, #preview { color: #1c1c1e !important; }
      #preview code, #preview pre.code-block { background: #f4f4f7 !important; color: #1c1c1e !important; }
      #preview th, #preview td { border-color: #ccc !important; }
      #preview thead th { background: #f4f4f7 !important; }
    }
  </style>
</head>
<body>
  <div class="header-wrap">
    <div class="toolbar">
      <div class="control">
        <span>فونت:</span>
        <select id="fontSelect">
          <option value="Vazirmatn">وزیرمتن</option>
          <option value="Shabnam">شبنم</option>
          <option value="Sahel">ساحل</option>
          <option value="Samim">صمیم</option>
        </select>
      </div>
      <div class="control">
        <span>اندازه:</span>
        <input type="range" id="sizeRange" min="13" max="34" value="18">
        <span class="size-val" id="sizeVal">18</span>
      </div>
      <div class="control">
        <span>🌙 تم:</span>
        <select id="themeSelect">
          <option value="system">سیستم</option>
          <option value="light">روشن</option>
          <option value="dark">تاریک</option>
        </select>
      </div>
      <button id="previewBtn">👁️ پیش‌نمایش مارک‌داون</button>
      <button id="copyBtn">📋 کپی متن</button>
      <button id="printBtn">🖨️ چاپ / PDF</button>
      <button id="outlineBtn" aria-controls="outline" aria-expanded="false" disabled>☰ فهرست تیترها</button>
      <button id="exportHtmlBtn">📥 خروجی HTML</button>
      <button class="accent" id="clearBtn">🗑️ پاک کردن</button>
      <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
      <div class="control file-current" id="currentFileControl">
        <span>📄 در حال خواندن:</span>
        <span id="currentFileName" class="current-file-name"></span>
      </div>
      <div class="brand">فارسی‌فای</div>
    </div>

    <div class="toolbar" style="border-top: 1px solid var(--toolbar-border);">
      <div class="control">
        <span>📥 بارگذاری .md از:</span>
        <input type="text" id="urlInput" placeholder="آدرس اینترنتی یا مسیر کامل فایل مثل E:\docs\file.md">
      </div>
      <button class="accent" id="loadUrlBtn">بارگذاری</button>
      <input type="file" id="mdFileInput" accept=".md,.markdown,.txt" style="display:none">
      <button id="loadFileBtn">📂 انتخاب فایل از سیستم</button>
      <input type="file" id="mdFolderInput" webkitdirectory multiple style="display:none">
      <button id="loadFolderBtn">🗂️ انتخاب پوشه</button>
    </div>

    <div class="file-header" id="fileHeader">
      <span class="file-header-label">📄 فایل‌های پوشه:</span>
      <div class="file-chip-list" id="fileChipList"></div>
    </div>

    <div class="perm-banner" id="permBanner">
      <span id="permBannerText"></span>
      <button class="accent" id="permRetryBtn" type="button">🔓 اجازه بده</button>
    </div>
    <div class="resource-notice" id="resourceNotice" role="status" hidden>
      <span id="resourceNoticeText"></span>
      <button id="attachResourceFolderBtn" type="button" hidden>انتخاب پوشهٔ منبع</button>
    </div>
  </div>

  <div class="document-layout" id="documentLayout">
    <aside class="outline" id="outline" hidden>
      <div class="outline-title">فهرست تیترها</div>
      <nav id="outlineList" aria-label="فهرست تیترهای سند"></nav>
    </aside>
    <main class="page">
      <div id="content" contenteditable="true" role="textbox" aria-label="متن سند" aria-multiline="true"></div>
      <div id="preview" dir="rtl"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="sel-toolbar" id="selToolbar">
    <button id="selLtrBtn" type="button">⬅️ چپ‌چین</button>
    <button id="selCodeBtn" type="button">💻 کد</button>
  </div>

  <script src="source-paths.js"></script>
  <script src="adjacent-tabs.js"></script>
  <script src="viewer-drafts.js"></script>
  <script src="task-lists.js"></script>
  <script src="viewer-resources.js"></script>
  <script src="reader-tools.js"></script>
  <script src="viewer-export.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
